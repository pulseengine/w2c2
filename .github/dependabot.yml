version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      github-actions-all:
        patterns:
          - '*'
  - package-ecosystem: cargo
    directory: /examples/rust-wasi
    schedule:
      interval: weekly
    labels:
      - dependencies
    groups:
      wasm-tools-family:
        patterns:
          - wasmparser
          - wasm-encoder
          - wasmprinter
          - wit-component
          - wit-parser
          - wasm-metadata
          - wat
          - walrus
      wasmtime:
        patterns:
          - wasmtime
          - wasmtime-*
